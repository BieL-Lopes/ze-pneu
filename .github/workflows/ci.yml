name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Mesma imagem do docker-compose local: um teste de integração que passa
    # na máquina do desenvolvedor precisa passar aqui.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zepneu_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zepneu_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/zepneu_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMERO: "5561999999999"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Aplicar migrações
        run: npm run db:migrate

      - name: Lint (inclui a fronteira de camada do núcleo)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
